name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Build Project WebGL"] # Must match the 'name' in your first file
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Only run if the build actually succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # We download the artifact from the specific workflow run that triggered this
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: Build
          path: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Adjusting path to match typical Unity Builder output structure
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4